services:
  - type: web
    name: wayfarer-travel-planner
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    autoDeploy: true
    healthCheckPath: /
